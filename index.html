<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local Burmese Movie Translator App</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto 20px auto;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border);
    }

    h2 { color: var(--accent); margin: 0; font-size: 22px; }

    #backend-status {
      display: flex; align-items: center; gap: 8px; font-size: 13px;
      background: var(--card-bg); padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border);
    }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background-color: #ef4444; }
    .status-dot.connected { background-color: #22c55e; }

    .main-container { display: flex; max-width: 1200px; margin: 0 auto; gap: 20px; flex-wrap: wrap; }

    .sidebar {
      flex: 1; min-width: 300px; background: var(--card-bg); padding: 20px;
      border-radius: 12px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 15px;
    }

    .control-group { display: flex; flex-direction: column; gap: 6px; }
    .control-group label { font-size: 13px; color: var(--text-muted); font-weight: 600; }

    .upload-box {
      border: 2px dashed var(--border); padding: 15px; text-align: center;
      border-radius: 8px; cursor: pointer; transition: 0.2s;
    }
    .upload-box:hover { border-color: var(--accent); }
    input[type="file"] { display: none; }
    .btn {
      background: var(--accent); color: #000; padding: 12px 16px; border-radius: 6px;
      font-weight: bold; cursor: pointer; border: none; text-align: center; width: 100%; transition: 0.2s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn-download { background: #22c55e; color: #000; }
    .btn-download:hover { background: #16a34a; color: #fff; }
    .btn-fs { background: #64748b; color: #fff; margin-top: 5px; }
    .btn-fs:hover { background: #475569; }

    input[type="range"], select, input[type="color"] {
      width: 100%; padding: 6px; background: #0f172a; border: 1px solid var(--border); color: #fff; border-radius: 6px;
    }
    .color-pickers { display: flex; gap: 10px; }
    .color-pickers > div { flex: 1; }

    .preview-section {
      flex: 2; min-width: 500px; background: var(--card-bg); padding: 20px;
      border-radius: 12px; border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center;
    }

    /* This container holds both the video and the subtitles so full-screen works perfectly! */
    .video-container {
      position: relative; width: 100%; max-width: 700px; background: #000;
      border-radius: 8px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    video { width: 100%; display: block; }

    #subtitle-overlay {
      position: absolute; width: 90%; left: 5%; text-align: center; pointer-events: none;
      font-family: 'Padauk', 'Pyidaungsu', 'Myanmar Text', sans-serif;
      font-weight: 600;
      line-height: 1.4;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9), -2px -2px 4px rgba(0, 0, 0, 0.9);
      padding: 6px 12px; border-radius: 4px; transition: all 0.08s ease;
    }

    #status-banner {
      display: none; width: 100%; max-width: 700px; background: #3b82f6; color: white;
      padding: 12px; border-radius: 6px; margin-bottom: 15px; font-weight: bold; text-align: center; word-break: break-all;
    }
  </style>
</head>
<body>

<header>
  <h2>🎬 Local Burmese Movie Translator</h2>
  <div id="backend-status">
    <div id="dot" class="status-dot"></div>
    <span id="status-text">Checking Backend Connection...</span>
  </div>
</header>

<div class="main-container">
  <div class="sidebar">
    <h3>Configuration Panel</h3>
    
    <div class="control-group">
      <label>1. Select Video File</label>
      <div class="upload-box" onclick="document.getElementById('videoFile').click()">
        <p id="file-name-display" style="margin: 0; font-size: 13px; color: var(--text-muted);">Click to choose video file</p>
        <input type="file" id="videoFile" accept="video/*" onchange="handleFileSelect(this)">
      </div>
    </div>

    <div class="control-group">
      <label>2. Font Size: <span id="sizeVal">26</span>px</label>
      <input type="range" id="fontSize" min="16" max="48" value="26">
    </div>

    <div class="color-pickers">
      <div class="control-group">
        <label>Text Color</label>
        <input type="color" id="textColor" value="#ffffff">
      </div>
      <div class="control-group">
        <label>Background Box</label>
        <input type="color" id="bgColor" value="#000000">
      </div>
    </div>

    <div class="control-group">
      <label>3. Subtitle Position</label>
      <select id="position">
        <option value="bottom">Bottom</option>
        <option value="top">Top</option>
      </select>
    </div>

    <hr style="border:0; border-top:1px solid var(--border); margin:5px 0;">

    <div class="control-group">
      <label>4. Export & Display</label>
      <button class="btn btn-download" onclick="downloadFinalVideo()">🎬 Download Final Video (.MP4)</button>
      <button class="btn btn-fs" onclick="toggleFullscreen()">📺 Toggle Fullscreen (With Subtitles)</button>
    </div>
  </div>

  <div class="preview-section">
    <h3 style="margin-top: 0; align-self: flex-start;">Video Preview Screen</h3>
    <div id="status-banner">Processing...</div>

    <div class="video-container" id="playerContainer">
      <video id="videoPlayer" controls></video>
      <div id="subtitle-overlay">Subtitles will appear here in real-time...</div>
    </div>
  </div>
</div>

<script>
  const video = document.getElementById('videoPlayer');
  const overlay = document.getElementById('subtitle-overlay');
  const fontSize = document.getElementById('fontSize');
  const sizeVal = document.getElementById('sizeVal');
  const textColor = document.getElementById('textColor');
  const bgColor = document.getElementById('bgColor');
  const position = document.getElementById('position');
  const statusBanner = document.getElementById('status-banner');
  const fileNameDisplay = document.getElementById('file-name-display');
  const statusDot = document.getElementById('dot');
  const statusText = document.getElementById('status-text');
  const playerContainer = document.getElementById('playerContainer');

  let subtitles = [];
  let currentServerVideoFilename = "";

  async function checkBackendConnection() {
    try {
      const response = await fetch('/docs');
      if (response.ok) {
        statusDot.classList.add('connected');
        statusText.innerText = "Backend Connected (Online)";
      } else throw new Error();
    } catch (e) {
      statusDot.classList.remove('connected');
      statusText.innerText = "Backend Disconnected";
    }
  }
  checkBackendConnection();
  setInterval(checkBackendConnection, 5000);

  function updateStyles() {
    const size = fontSize.value;
    sizeVal.innerText = size;
    overlay.style.fontSize = size + 'px';
    overlay.style.color = textColor.value;
    
    const hex = bgColor.value;
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    overlay.style.backgroundColor = `rgba(${r}, ${g}, ${b}, 0.5)`;

    if (position.value === 'bottom') {
      overlay.style.bottom = '8%'; overlay.style.top = 'auto';
    } else {
      overlay.style.top = '8%'; overlay.style.bottom = 'auto';
    }
  }

  [fontSize, textColor, bgColor, position].forEach(el => el.addEventListener('input', updateStyles));
  updateStyles();

  // Fullscreen function that keeps the video and Burmese subtitles together!
  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      playerContainer.requestFullscreen().catch(err => {
        alert("Error attempting to enable fullscreen: " + err.message);
      });
    } else {
      document.exitFullscreen();
    }
  }

  async function handleFileSelect(fileInput) {
    const file = fileInput.files[0];
    if (!file) return;

    fileNameDisplay.innerText = file.name;
    const formData = new FormData();
    formData.append("file", file);

    statusBanner.style.display = "block";
    statusBanner.style.background = "#3b82f6";
    statusBanner.innerText = "Translating video to Burmese... Please wait.";

    try {
      const response = await fetch('/translate-video/', {
        method: 'POST', body: formData
      });
      
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Unknown server error");

      subtitles = data.subtitles;
      currentServerVideoFilename = data.video_filename;
      
      video.src = URL.createObjectURL(file);
      statusBanner.style.background = "#22c55e";
      statusBanner.innerText = "Translation Complete! You can play or download the final video.";
      
      setTimeout(() => { statusBanner.style.display = "none"; }, 4000);

    } catch (error) {
      console.error("Translation Error:", error);
      statusBanner.style.background = "#ef4444";
      statusBanner.innerText = "Error: " + error.message;
    }
  }

  video.addEventListener('timeupdate', () => {
    const currentTime = video.currentTime;
    const currentSub = subtitles.find(s => currentTime >= s.start && currentTime <= s.end);
    overlay.innerText = currentSub ? currentSub.text : '';
  });

  async function downloadFinalVideo() {
    if (subtitles.length === 0 || !currentServerVideoFilename) {
      alert("Please upload and translate a video first!");
      return;
    }

    statusBanner.style.display = "block";
    statusBanner.style.background = "#3b82f6";
    statusBanner.innerText = "Rendering final MP4 video with hardcoded subtitles... Please wait.";

    const formData = new FormData();
    formData.append("video_filename", currentServerVideoFilename);
    formData.append("subtitles", JSON.stringify(subtitles));

    try {
      const response = await fetch('/render-video/', {
        method: 'POST', body: formData
      });

      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || "Video rendering failed");

      const blob = await response.blob();
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = "translated_burmese_movie.mp4";
      document.body.appendChild(a);
      a.click();
      a.remove();

      statusBanner.style.background = "#22c55e";
      statusBanner.innerText = "Final video rendered and downloaded successfully!";
      setTimeout(() => { statusBanner.style.display = "none"; }, 4000);
    } catch (e) {
      statusBanner.style.background = "#ef4444";
      statusBanner.innerText = "Error: " + e.message;
    }
  }
</script>

</body>
</html>
